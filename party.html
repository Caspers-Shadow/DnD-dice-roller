<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Faerie's Fortune - Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button class="menu-btn" id="hamburgerBtn" aria-expanded="false" aria-controls="drawer" aria-label="Open menu">☰</button>
<div class="drawer-overlay" id="drawerOverlay" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="drawer-title">The Faerie's Fortune</span>
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">✕</button>
  </div>
  <nav class="drawer-nav">
    <a href="dashboard.html">← Your Parties</a>
    <button id="drawerLogout">Log Out</button>
  </nav>
  <div class="drawer-divider"></div>

  <div class="notebook">
    <div class="party-form">
      <input type="text" id="noteInput" placeholder="Write a note…" maxlength="200">
      <button class="die-btn" id="noteBtn">Add</button>
    </div>
    <div class="notebook-page" id="notebookPage">
      <p class="page-empty">Loading…</p>
    </div>
    <div class="notebook-nav">
      <button class="link-btn" id="pagePrev">‹ Prev</button>
      <span class="page-indicator" id="pageIndicator"></span>
      <button class="link-btn" id="pageNext">Next ›</button>
    </div>
  </div>
</aside>

<div id="ambience"></div>

<div class="stage">
  <header>
    <p class="eyebrow">The Gaming Table</p>
    <h1 id="partyTitle">The Faerie's <span>Fortune</span></h1>
  </header>

  <div class="party-panel" id="partyInfo" style="width:min(100%,560px); margin-bottom:22px;">
    <p class="party-hint">Loading party…</p>
  </div>

  <div class="theme-select" id="themeSelect" role="group" aria-label="Choose a table theme">
    <span class="theme-label">Table</span>
  </div>

  <div class="dice-select" id="diceSelect" role="tablist" aria-label="Choose a die"></div>

  <div class="tray-wrap" id="trayWrap">
    <div class="tray-rim" id="tray" role="button" tabindex="0" aria-label="Roll the die">
      <div class="tray-felt">
        <canvas id="scene" aria-hidden="true"></canvas>
      </div>
    </div>
    <div class="result-hud" id="resultHud" aria-live="polite">-</div>
  </div>

  <p class="hint" id="hint">Click the tray, or press Enter / Space, to roll</p>

  <div class="ledger" style="margin-top:26px;">
    <div class="auth-row" style="margin-bottom:10px;">
      <h2 id="ledgerHeading" style="margin:0;">Log</h2>
      <button class="link-btn" id="refreshBtn">Refresh</button>
    </div>
    <ul id="log"><li class="empty">Loading…</li></ul>
  </div>
</div>

<!-- Accounts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>

<!-- 3D dice -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="dice.js"></script>

<!-- This party's roster, sessions, and shared log -->
<script src="party-room.js"></script>
</body>
</html>
